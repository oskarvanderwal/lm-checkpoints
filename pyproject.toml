[project]
name = "lm-checkpoints"
version = "0.1.15"
description = "Simple library for loading checkpoints of language models."
authors = [{name = "Oskar van der Wal", email = "odw@duck.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "transformers>=4.35.0",
    "torch>=2.0.0,!=2.0.1,!=2.1.0",
    "accelerate>=0.24.1",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4.2"]
dev = [
    "pytest>=7.4.3",
    "black>=23.11.0",
    "ruff>=0.4.1",
]

[project.scripts]
evaluate_checkpoints = "lm_checkpoints.evaluator:main"

[tool.black]
skip-string-normalization = true
line-length = 120

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lm_checkpoints"]
