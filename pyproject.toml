[tool.poetry]
name = "lm-checkpoints"
version = "0.2.0"
description = "Simple library for iterating over training checkpoints of language models."
authors = ["Oskar van der Wal <odw@duck.com>"]
license = "MIT"
readme = "README.md"
packages = [
            {include = "lm_checkpoints"}
]

[tool.black]
skip-string-normalization = true
line-length = 120

[tool.ruff]
# Same as Black.
line-length = 120

[tool.poetry.dependencies]
python = ">=3.9"
transformers = ">=4.35.0"
torch = ">=2.0.0, !=2.0.1, !=2.1.0"
huggingface-hub = ">=0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3"
black = ">=23.11.0"
ruff = ">=0.4.1"

[tool.pytest.ini_options]
markers = ["network: downloads models from the HF hub (run with --run-network)"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
