[project]
name = "lm-checkpoints"
version = "0.1.16"
description = "Simple library for loading checkpoints of language models."
authors = [{name = "Oskar van der Wal", email = "odw@duck.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.45.0",
    "torch>=2.1.0",
    "accelerate>=1.0.0",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4.5"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
evaluate_checkpoints = "lm_checkpoints.evaluator:main"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "preserve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lm_checkpoints"]
